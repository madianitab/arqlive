<div class="sim-config">
  <os-panel title="Programa">
    <label class="rotulo" for="ex">Exemplo da aula</label>
    <select id="ex" class="form-control" [ngModel]="sim.exemplo()" (ngModelChange)="sim.carregarExemplo($event)">
      @if (!sim.exemplo()) { <option value="">Código próprio</option> }
      @for (e of sim.exemplos; track e.id) { <option [value]="e.id">{{ e.nome }}</option> }
    </select>
  </os-panel>

  @if (sim.programa().entradasUsadas.length) {
    <os-panel title="Portas de entrada">
      <p class="hint">Valores lidos pelo IN. Mudou? A execução é refeita.</p>
      @for (p of sim.programa().entradasUsadas; track p) {
        <div class="porta">
          <span class="porta-nome">{{ rotulo(p) }}</span>
          @if (analogica(p)) {
            <input type="range" min="0" max="1023" [ngModel]="sim.valorEntrada(p)" (ngModelChange)="sim.definirEntrada(p, $event)" [attr.aria-label]="p" />
            <input type="number" class="form-control num" min="0" max="1023" [ngModel]="sim.valorEntrada(p)" (ngModelChange)="sim.definirEntrada(p, $event)" [attr.aria-label]="p + ' (valor)'" />
          } @else {
            <button type="button" class="toggle" [class.on]="sim.valorEntrada(p) === 1" [attr.aria-pressed]="sim.valorEntrada(p) === 1"
                    (click)="sim.definirEntrada(p, sim.valorEntrada(p) ? 0 : 1)">
              {{ sim.valorEntrada(p) }} · {{ p === 'BOTAO' ? (sim.valorEntrada(p) ? 'apertado' : 'solto') : (sim.valorEntrada(p) ? 'HIGH' : 'LOW') }}
            </button>
          }
        </div>
      }
    </os-panel>
  }

  <os-panel title="Passo a passo">
    <div class="modo" role="radiogroup" aria-label="Como avançar">
      <label class="check-row"><input type="radio" name="modo" [checked]="sim.modo() === 'ciclo'" (change)="sim.definirModo('ciclo')" />
        Busca, decodificação e execução</label>
      <label class="check-row"><input type="radio" name="modo" [checked]="sim.modo() === 'instrucao'" (change)="sim.definirModo('instrucao')" />
        Uma instrução por passo</label>
    </div>
  </os-panel>

  <os-panel title="Assembly simplificado">
    <p class="hint">O destino vem sempre primeiro. Registradores <code>R0</code> a <code>R7</code>; só <code>LOAD</code>/<code>STORE</code> acessam a memória.</p>
    <button type="button" class="abrir-tabela" (click)="sim.abrirTabela()"><i class="fa-solid fa-book-open"></i> Ver todas as instruções</button>
  </os-panel>
</div>
